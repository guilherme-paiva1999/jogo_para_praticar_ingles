<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Quest — Jogo de gramática inglesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Sora:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root {
    --paper: #F6F4EC;
    --ink: #17163B;
    --ink-soft: #55547A;
    --card: #FFFFFF;
    --tobe: #2447F5;      --tobe-soft: #DDE4FE;
    --presimple: #F5A623; --presimple-soft: #FCEBCB;
    --pastsimple: #D6482B;--pastsimple-soft: #F8DCD4;
    --precont: #14957A;   --precont-soft: #D3EEE7;
    --pastcont: #8B44D6;  --pastcont-soft: #E9DCF8;
    --mix: #17163B;       --mix-soft: #E2E1EE;
    --ok: #14957A; --ok-soft: #D3EEE7;
    --bad: #D6482B; --bad-soft: #F8DCD4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Sora', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 48px;
    background-image: radial-gradient(#17163B0D 1px, transparent 1px);
    background-size: 22px 22px;
    overflow-x: hidden;
  }
  .wrap { width: 100%; max-width: 520px; }
  h1, h2 { font-family: 'Bricolage Grotesque', sans-serif; }
  header { text-align: center; margin-bottom: 28px; }
  .logo {
    display: inline-block; font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
    background: var(--ink); color: var(--paper); padding: 6px 14px; border-radius: 999px;
    margin-bottom: 14px;
  }
  header h1 { font-size: clamp(30px, 7vw, 40px); font-weight: 800; line-height: 1.1; }
  header h1 em { font-style: normal; color: var(--tobe); }
  header p { color: var(--ink-soft); font-size: 15px; margin-top: 8px; }

  .levels { display: grid; gap: 12px; }
  .level {
    border: 2.5px solid var(--ink); border-radius: 16px; background: var(--card);
    padding: 18px 16px; text-align: left; cursor: pointer; font-family: inherit;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .12s ease, box-shadow .12s ease;
    display: flex; align-items: center; gap: 14px;
  }
  .level:hover:not(:disabled), .level:focus-visible:not(:disabled) { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  .level:active:not(:disabled) { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
  .level:disabled { cursor: not-allowed; opacity: .65; background: var(--paper); }
  .level .lbadge {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px;
    width: 52px; height: 52px; border-radius: 12px; border: 2.5px solid var(--ink);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    background: var(--tobe-soft);
  }
  .level:nth-child(2) .lbadge { background: var(--presimple-soft); }
  .level:nth-child(3) .lbadge { background: var(--precont-soft); }
  .level:nth-child(4) .lbadge { background: var(--pastsimple-soft); }
  .level:nth-child(5) .lbadge { background: var(--pastcont-soft); }
  .level:nth-child(6) .lbadge { background: var(--mix-soft); }
  .level .lname { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; display: block; }
  .level .ldesc { font-size: 12.5px; color: var(--ink-soft); display: block; margin-top: 2px; }
  .level .lprog { font-size: 12px; color: var(--ink-soft); display: block; margin-top: 4px; font-weight: 600; }

  .topics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .topic {
    border: 2.5px solid var(--ink); border-radius: 16px; background: var(--card);
    padding: 16px 14px 14px; text-align: left; cursor: pointer; font-family: inherit;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .12s ease, box-shadow .12s ease;
    display: flex; flex-direction: column; gap: 10px; min-height: 104px;
    position: relative;
  }
  .topic:hover, .topic:focus-visible { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  .topic:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
  .topic .dot { width: 26px; height: 26px; border-radius: 8px; border: 2.5px solid var(--ink); flex-shrink: 0; }
  .topic .tname { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 15px; line-height: 1.2; display: block; }
  .topic .tsub { font-size: 12px; color: var(--ink-soft); }
  .topic .tbest {
    position: absolute; top: 10px; right: 10px;
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
    border: 2px solid var(--ink); background: var(--ok-soft);
  }
  .topic.mix { grid-column: 1 / -1; flex-direction: row; align-items: center; }
  .topic.mix .dot { background: repeating-linear-gradient(45deg, var(--tobe) 0 6px, var(--presimple) 6px 12px, var(--precont) 12px 18px, var(--pastcont) 18px 24px); }

  .modes { display: grid; gap: 12px; }
  .mode {
    border: 2.5px solid var(--ink); border-radius: 16px; background: var(--card);
    padding: 18px 16px; text-align: left; cursor: pointer; font-family: inherit;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .12s ease, box-shadow .12s ease;
    display: flex; align-items: center; gap: 14px;
  }
  .mode:hover, .mode:focus-visible { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  .mode:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
  .mode .micon { font-size: 30px; }
  .mode .mname { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; display: block; }
  .mode .msub { font-size: 13px; color: var(--ink-soft); }
  .backlink {
    background: none; border: none; font-family: 'Sora', sans-serif; font-size: 14px;
    color: var(--ink-soft); cursor: pointer; margin-bottom: 16px; padding: 4px 0;
    text-decoration: underline;
  }

  .hidden { display: none !important; }

  .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; flex-wrap: wrap; gap: 6px; }
  .hud .tense-badge {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 12px;
    padding: 5px 12px; border-radius: 999px; border: 2px solid var(--ink);
  }
  .hud .score { font-weight: 600; color: var(--ink-soft); }
  .bar { height: 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--card); overflow: hidden; margin-bottom: 22px; }
  .bar > div { height: 100%; width: 0%; background: var(--ink); border-radius: 999px; transition: width .3s ease; }

  .qcard {
    background: var(--card); border: 2.5px solid var(--ink); border-radius: 20px;
    box-shadow: 6px 6px 0 var(--ink); padding: 26px 22px 22px;
    animation: slideIn .3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) {
    .qcard { animation: none; }
    .topic, .mode, .level, .opt, .btn, .chip { transition: none; }
    .pop, .shake { animation: none !important; }
    .confetti { display: none; }
  }
  .pop { animation: pop .3s ease; }
  .shake { animation: shake .3s ease; }

  .qtext { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(20px, 5vw, 24px); line-height: 1.35; margin-bottom: 20px; }
  .qtext .blank { border-bottom: 3px solid currentColor; padding: 0 18px; }
  .instruction { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; }

  .opts { display: grid; gap: 10px; }
  .opt {
    font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 600;
    text-align: left; padding: 13px 16px;
    border: 2px solid var(--ink); border-radius: 12px;
    background: var(--paper); color: var(--ink); cursor: pointer;
    transition: transform .1s ease, background .15s ease;
    display: flex; align-items: center; gap: 12px;
  }
  .opt .key {
    width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--ink);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0; background: var(--card);
  }
  .opt:hover:not(:disabled), .opt:focus-visible:not(:disabled) { transform: translateX(3px); }
  .opt:disabled { cursor: default; }
  .opt.correct { background: var(--ok-soft); border-color: var(--ok); }
  .opt.correct .key { background: var(--ok); border-color: var(--ok); color: #fff; }
  .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
  .opt.wrong .key { background: var(--bad); border-color: var(--bad); color: #fff; }
  .opt.faded { opacity: .45; }

  .build-zone {
    min-height: 64px; border: 2px dashed var(--ink-soft); border-radius: 12px;
    padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start;
    margin-bottom: 16px; background: var(--paper);
    transition: border-color .2s ease;
  }
  .build-zone.right { border-color: var(--ok); border-style: solid; background: var(--ok-soft); }
  .build-zone.err { border-color: var(--bad); border-style: solid; background: var(--bad-soft); }
  .build-zone .placeholder { color: var(--ink-soft); font-size: 13px; padding: 6px 2px; }
  .chip-bank { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 600;
    padding: 9px 14px; border: 2px solid var(--ink); border-radius: 999px;
    background: var(--card); color: var(--ink); cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform .1s ease, opacity .15s ease;
  }
  .chip:hover:not(:disabled), .chip:focus-visible:not(:disabled) { transform: translate(-1px,-1px); }
  .chip:active { transform: translate(1px,1px); box-shadow: 0 0 0 var(--ink); }
  .chip.used { opacity: 0; pointer-events: none; }
  .chip.placed { box-shadow: none; background: var(--paper); }

  .type-row { display: flex; gap: 10px; margin-bottom: 4px; }
  .type-input {
    flex: 1; font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600;
    padding: 12px 16px; border: 2px solid var(--ink); border-radius: 12px;
    background: var(--paper); color: var(--ink); min-width: 0;
  }
  .type-input:focus { outline: 3px solid var(--tobe-soft); border-color: var(--tobe); }
  .type-input.right { border-color: var(--ok); background: var(--ok-soft); }
  .type-input.err { border-color: var(--bad); background: var(--bad-soft); }
  .hint { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; }
  .hint b { color: var(--ink); }

  .feedback {
    margin-top: 18px; border-radius: 12px; padding: 14px 16px;
    border: 2px solid; font-size: 14px; line-height: 1.55;
    animation: slideIn .25s ease;
  }
  .feedback.good { background: var(--ok-soft); border-color: var(--ok); }
  .feedback.bad { background: var(--bad-soft); border-color: var(--bad); }
  .feedback strong { font-family: 'Bricolage Grotesque', sans-serif; display: block; margin-bottom: 4px; font-size: 15px; }
  .streak { display: inline-block; margin-left: 6px; font-weight: 700; }

  .btn {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px;
    background: var(--ink); color: var(--paper);
    border: 2.5px solid var(--ink); border-radius: 12px;
    padding: 14px 20px; width: 100%; cursor: pointer; margin-top: 16px;
    box-shadow: 4px 4px 0 rgba(23,22,59,.25);
    transition: transform .12s ease;
  }
  .btn:hover, .btn:focus-visible { transform: translate(-1px,-1px); }
  .btn:active { transform: translate(1px,1px); }
  .btn.ghost { background: var(--card); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  .btn.small { width: auto; padding: 12px 18px; margin-top: 0; flex-shrink: 0; }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }

  .result { text-align: center; }
  .result .bignum { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; line-height: 1; }
  .result .bignum small { font-size: 24px; color: var(--ink-soft); font-weight: 700; }
  .result .msg { margin: 10px 0 4px; font-size: 17px; font-weight: 600; }
  .result .sub { color: var(--ink-soft); font-size: 14px; margin-bottom: 8px; }
  .result .unlock {
    margin: 0 auto 16px; display: inline-block;
    font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 999px;
    border: 2px solid var(--ok); background: var(--ok-soft); color: var(--ink);
  }
  .medal {
    width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--ink);
    margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;
    font-size: 34px; box-shadow: 4px 4px 0 var(--ink); background: var(--card);
  }
  .review { text-align: left; margin-top: 26px; }
  .review h2 { font-size: 17px; margin-bottom: 10px; }
  .review-item {
    border: 2px solid var(--ink); border-radius: 12px; background: var(--card);
    padding: 12px 14px; margin-bottom: 8px; font-size: 13.5px; line-height: 1.5;
  }
  .review-item .ans { font-weight: 700; color: var(--ok); }

  .confetti { position: fixed; top: -20px; font-size: 22px; pointer-events: none; z-index: 99; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .3; } }

  footer { margin-top: 36px; text-align: center; font-size: 12px; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="logo">Grammar Quest</span>
    <h1>Domine a gramática do <em>inglês</em></h1>
    <p id="subtitle">Identifique-se para começar</p>
  </header>

  <section id="nameScreen" class="hidden">
    <div class="qcard">
      <p class="qtext">Qual é o seu nome?</p>
      <p class="instruction">👤 Seu progresso será salvo com esse nome para o professor acompanhar.</p>
      <div class="type-row">
        <input class="type-input" id="nameInput" type="text" autocomplete="off" maxlength="40" placeholder="Digite seu nome…" aria-label="Seu nome">
        <button class="btn small" id="nameBtn">Entrar</button>
      </div>
      <p class="hint" id="nameError" style="color:var(--bad); margin-top:10px;"></p>
    </div>
  </section>

  <p id="playerBar" class="hidden" style="text-align:center; font-size:14px; margin:-14px 0 18px; color:var(--ink-soft);">
    👤 <b id="playerName" style="color:var(--ink)"></b>
    <button id="changeName" class="backlink" style="margin:0 0 0 8px; font-size:13px;">trocar</button>
  </p>

  <section id="placementScreen" class="hidden"></section>

  <section id="levelScreen" class="levels hidden" aria-label="Escolha um nível"></section>

  <section id="menu" class="hidden">
    <button class="backlink" id="backToLevels">← Voltar aos níveis</button>
    <div class="topics" id="topicList"></div>
  </section>

  <section id="modeScreen" class="hidden">
    <button class="backlink" id="backToTopics">← Voltar aos temas</button>
    <div class="modes" id="modeList"></div>
  </section>

  <section id="game" class="hidden" aria-live="polite">
    <div class="hud">
      <span class="tense-badge" id="badge"></span>
      <span class="score" id="hudScore"></span>
    </div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="qcard" id="qcard"></div>
  </section>

  <section id="result" class="hidden">
    <div class="qcard result">
      <div class="medal" id="medal"></div>
      <div class="bignum"><span id="finalScore"></span><small id="finalTotal"></small></div>
      <p class="msg" id="finalMsg"></p>
      <p class="sub" id="finalSub"></p>
      <div id="unlockMsg"></div>
      <button class="btn" id="againBtn">Jogar de novo</button>
      <button class="btn ghost" id="modeBtn">Trocar de modo</button>
      <button class="btn ghost" id="menuBtn">Escolher outro tema</button>
      <div class="review" id="review"></div>
    </div>
  </section>

  <footer>Níveis A1 a C2 — do verbo to be às participle clauses</footer>
</div>

<script src="questoes.js"></script>
<script>
const MODES = [
  { id: "quiz", icon: "🎯", name: "Quiz", sub: "Escolha a alternativa correta" },
  { id: "build", icon: "🧩", name: "Monte a frase", sub: "Toque nas palavras na ordem certa" },
  { id: "type", icon: "⌨️", name: "Digite a resposta", sub: "Escreva a forma correta, sem alternativas" }
];

let state = { level: null, topic: null, mode: null, qs: [], idx: 0, score: 0, streak: 0, best: 0, wrongs: [], answers: [], built: [] };
let player = null;

const $ = id => document.getElementById(id);
const nameScreen = $("nameScreen"), placementScreen = $("placementScreen"), levelScreen = $("levelScreen"),
      menu = $("menu"), modeScreen = $("modeScreen"), game = $("game"), result = $("result");

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function topicOf(id) {
  if (id === "mix") return { id: "mix", name: "Modo misto", color: "var(--mix)", soft: "var(--mix-soft)" };
  return TOPICS.find(t => t.id === id);
}
function levelOf(id) { return NIVEIS.find(n => n.id === id); }
function show(el) {
  [nameScreen, placementScreen, levelScreen, menu, modeScreen, game, result].forEach(s => s.classList.add("hidden"));
  el.classList.remove("hidden");
  $("playerBar").classList.toggle("hidden", el === nameScreen || !player);
}
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function slugName(name) {
  return name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 50);
}

// ---------- Progresso local (desbloqueio) ----------
function getProg() {
  try { return JSON.parse(localStorage.getItem("gq_prog_" + slugName(player)) || "{}"); }
  catch (e) { return {}; }
}
function setProg(p) {
  try { localStorage.setItem("gq_prog_" + slugName(player), JSON.stringify(p)); } catch (e) {}
}
function topicsDone(levelId) {
  const prog = getProg();
  return TOPICS.filter(t => t.level === levelId && (prog[t.id] || 0) >= CONFIG.pctMinimo).length;
}
function levelUnlocked(levelId) {
  if (!CONFIG.desbloqueio) return true;
  const idx = NIVEIS.findIndex(n => n.id === levelId);
  if (idx <= 0) return true;
  const place = getPlacement();
  if (place) {
    const pIdx = NIVEIS.findIndex(n => n.id === place);
    if (idx <= pIdx) return true;
  }
  return topicsDone(NIVEIS[idx - 1].id) >= CONFIG.temasMinimos;
}

// ---------- Teste de nivelamento ----------
function placeKey() { return "gq_place_" + slugName(player); }
function getPlacement() {
  try { return localStorage.getItem(placeKey()); } catch (e) { return null; }
}

let placement = { lvlIdx: 0, qs: [], qIdx: 0, correct: 0, detail: {} };

function startPlacementIntro() {
  $("subtitle").textContent = "Teste de nivelamento";
  placementScreen.innerHTML = `
    <div class="qcard">
      <p class="qtext">Vamos descobrir seu nível? 🎯</p>
      <p class="instruction">São 3 perguntas por nível, do A1 ao C2 — você avança enquanto acertar. Não se preocupe em errar: o teste serve só para liberar os níveis certos para você, e é feito uma única vez.</p>
      <button class="btn" id="startPlacement">Começar o teste</button>
      <button class="btn ghost" id="skipPlacement">Pular e começar do A1</button>
    </div>`;
  $("startPlacement").addEventListener("click", runPlacement);
  $("skipPlacement").addEventListener("click", () => finishPlacement("A1", true, null));
  show(placementScreen);
}

function pickPlacement(lvl) {
  const ids = TOPICS.filter(t => t.level === lvl).map(t => t.id);
  const all = ids.flatMap(k => (QUIZ[k] || []).map(q => ({ ...q, lvl })));
  return shuffle(all).slice(0, 3);
}

function runPlacement() {
  placement = { lvlIdx: 0, qs: [], qIdx: 0, correct: 0, detail: {} };
  nextPlacementLevel();
}

function nextPlacementLevel() {
  placement.qs = pickPlacement(NIVEIS[placement.lvlIdx].id);
  placement.qIdx = 0;
  placement.correct = 0;
  renderPlacementQ();
}

function renderPlacementQ() {
  const q = placement.qs[placement.qIdx];
  const lvl = NIVEIS[placement.lvlIdx].id;
  const letters = ["A", "B", "C", "D"];
  placementScreen.innerHTML = `
    <div class="hud">
      <span class="tense-badge" style="background:var(--mix-soft)">Nivelamento · ${lvl}</span>
      <span class="score">Pergunta ${placement.qIdx + 1} de 3</span>
    </div>
    <div class="bar"><div style="width:${Math.round(placement.lvlIdx / NIVEIS.length * 100)}%;background:var(--ink);height:100%;border-radius:999px"></div></div>
    <div class="qcard">
      <p class="qtext">${esc(q.q).replace("___", '<span class="blank">&nbsp;</span>')}</p>
      <div class="opts">${q.opts.map((o, i) =>
        `<button class="opt" data-i="${i}"><span class="key">${letters[i]}</span>${esc(o)}</button>`).join("")}</div>
    </div>`;
  placementScreen.querySelectorAll(".opt").forEach(btn =>
    btn.addEventListener("click", () => {
      const i = parseInt(btn.dataset.i);
      const correct = i === q.a;
      if (correct) placement.correct++;
      placementScreen.querySelectorAll(".opt").forEach((b, bi) => {
        b.disabled = true;
        if (bi === q.a) b.classList.add("correct");
        else if (bi === i) b.classList.add("wrong");
        else b.classList.add("faded");
      });
      setTimeout(() => {
        placement.qIdx++;
        if (placement.qIdx < placement.qs.length) { renderPlacementQ(); return; }
        const lvlId = NIVEIS[placement.lvlIdx].id;
        placement.detail[lvlId] = placement.correct;
        const passed = placement.correct >= 2;
        if (passed && placement.lvlIdx < NIVEIS.length - 1) {
          placement.lvlIdx++;
          nextPlacementLevel();
        } else if (passed) {
          finishPlacement(NIVEIS[NIVEIS.length - 1].id, false, placement.detail);
        } else {
          finishPlacement(lvlId, false, placement.detail);
        }
      }, 900);
    }));
}

function finishPlacement(level, skipped, detail) {
  try { localStorage.setItem(placeKey(), level); } catch (e) {}
  savePlacementToCloud(level, skipped, detail);
  if (skipped) { renderLevels(); return; }
  $("subtitle").textContent = "Resultado do nivelamento";
  const n = levelOf(level);
  const detailTxt = detail
    ? "Acertos — " + Object.entries(detail).map(([k, v]) => `${k}: ${v}/3`).join(" · ")
    : "";
  placementScreen.innerHTML = `
    <div class="qcard result">
      <div class="medal">🎯</div>
      <p class="msg" style="font-size:22px">Seu nível: ${n.name}</p>
      <p class="sub">${detailTxt}</p>
      <p class="sub">${level === "A1"
        ? "Você vai começar pelo início — perfeito para construir uma base forte!"
        : "Os níveis até o " + level + " já estão liberados para você. Bom jogo!"}</p>
      <button class="btn" id="goLevels">Começar a jogar</button>
    </div>`;
  if (level !== "A1") confettiBurst();
  $("goLevels").addEventListener("click", renderLevels);
  show(placementScreen);
}

async function savePlacementToCloud(level, skipped, detail) {
  if (!db || !player) return;
  try {
    await db.collection("students").doc(slugName(player)).set({
      name: player,
      placementLevel: level,
      placementSkipped: !!skipped,
      placementDetail: detail || null,
      placementDate: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) { console.warn("Não foi possível salvar o nivelamento:", e); }
}

// ---------- Telas ----------
function renderLevels() {
  $("subtitle").textContent = "Escolha o seu nível";
  levelScreen.innerHTML = NIVEIS.map(n => {
    const unlocked = levelUnlocked(n.id);
    const total = TOPICS.filter(t => t.level === n.id).length;
    const done = topicsDone(n.id);
    const prev = NIVEIS[NIVEIS.findIndex(x => x.id === n.id) - 1];
    const progTxt = unlocked
      ? `✅ ${done} de ${total} temas dominados (≥${CONFIG.pctMinimo}%)`
      : `🔒 Domine ${CONFIG.temasMinimos} temas do ${prev.id} para liberar (${topicsDone(prev.id)}/${CONFIG.temasMinimos})`;
    return `
      <button class="level" data-id="${n.id}" ${unlocked ? "" : "disabled"}>
        <span class="lbadge">${unlocked ? n.id : "🔒"}</span>
        <span>
          <span class="lname">${n.name}</span>
          <span class="ldesc">${n.desc}</span>
          <span class="lprog">${progTxt}</span>
        </span>
      </button>`;
  }).join("");
  levelScreen.querySelectorAll(".level:not([disabled])").forEach(btn =>
    btn.addEventListener("click", () => openLevel(btn.dataset.id)));
  show(levelScreen);
}

function openLevel(levelId) {
  state.level = levelId;
  const n = levelOf(levelId);
  $("subtitle").textContent = n.name + " — escolha um tema";
  const prog = getProg();
  const topics = TOPICS.filter(t => t.level === levelId);
  $("topicList").innerHTML = topics.map(t => {
    const best = prog[t.id];
    return `
      <button class="topic" data-id="${t.id}">
        ${best !== undefined ? `<span class="tbest" style="${best >= CONFIG.pctMinimo ? "" : "background:var(--presimple-soft)"}">${best}%</span>` : ""}
        <span class="dot" style="background:${t.soft};border-color:${t.color}"></span>
        <span><span class="tname">${t.name}</span>
        <span class="tsub">${t.sub}</span></span>
      </button>`;
  }).join("") + `
    <button class="topic mix" data-id="mix">
      <span class="dot"></span>
      <span><span class="tname">Modo misto</span>
      <span class="tsub">Perguntas de todos os temas do ${levelId}</span></span>
    </button>`;
  $("topicList").querySelectorAll(".topic").forEach(btn =>
    btn.addEventListener("click", () => openModes(btn.dataset.id)));
  show(menu);
}

function openModes(topicId) {
  state.topic = topicId;
  const tName = topicId === "mix" ? "Modo misto (" + state.level + ")" : topicOf(topicId).name;
  $("subtitle").textContent = tName + " — como você quer jogar?";
  $("modeList").innerHTML = MODES.map(m => `
    <button class="mode" data-id="${m.id}">
      <span class="micon">${m.icon}</span>
      <span><span class="mname">${m.name}</span>
      <span class="msub">${m.sub}</span></span>
    </button>`).join("");
  $("modeList").querySelectorAll(".mode").forEach(btn =>
    btn.addEventListener("click", () => start(state.topic, btn.dataset.id)));
  show(modeScreen);
}

$("backToLevels").addEventListener("click", renderLevels);
$("backToTopics").addEventListener("click", () => openLevel(state.level));

// ---------- Jogo ----------
function start(topicId, mode) {
  const SRC = mode === "quiz" ? QUIZ : mode === "build" ? BUILD : TYPE;
  let pool;
  if (topicId === "mix") {
    const ids = TOPICS.filter(t => t.level === state.level).map(t => t.id);
    pool = shuffle(ids.flatMap(k =>
      shuffle((SRC[k] || []).map(q => ({ ...q, cat: k }))).slice(0, 2)));
    pool = pool.slice(0, mode === "build" ? 8 : 12);
  } else {
    pool = shuffle((SRC[topicId] || []).map(q => ({ ...q, cat: topicId })));
  }
  state = { ...state, topic: topicId, mode, qs: pool, idx: 0, score: 0, streak: 0, best: 0, wrongs: [], answers: [], built: [] };
  show(game);
  renderQuestion();
}

function hud() {
  const q = state.qs[state.idx];
  const t = topicOf(q.cat);
  $("badge").textContent = state.level + " · " + t.name;
  $("badge").style.background = t.soft;
  $("hudScore").textContent = `Pergunta ${state.idx + 1} de ${state.qs.length} · ⭐ ${state.score}`;
  $("barFill").style.width = Math.round((state.idx / state.qs.length) * 100) + "%";
  $("barFill").style.background = t.color;
}

function renderQuestion() {
  hud();
  if (state.mode === "quiz") renderQuiz();
  else if (state.mode === "build") renderBuild();
  else renderType();
}

function renderQuiz() {
  const q = state.qs[state.idx];
  const letters = ["A", "B", "C", "D"];
  $("qcard").innerHTML = `
    <p class="qtext">${esc(q.q).replace("___", '<span class="blank">&nbsp;</span>')}</p>
    <div class="opts">${q.opts.map((o, i) =>
      `<button class="opt" data-i="${i}"><span class="key">${letters[i]}</span>${esc(o)}</button>`).join("")}</div>
    <div id="feedback"></div>
    <button class="btn hidden" id="nextBtn"></button>`;
  $("qcard").querySelectorAll(".opt").forEach(btn =>
    btn.addEventListener("click", () => answerQuiz(parseInt(btn.dataset.i))));
}

function answerQuiz(i) {
  const q = state.qs[state.idx];
  const correct = i === q.a;
  $("qcard").querySelectorAll(".opt").forEach((b, bi) => {
    b.disabled = true;
    if (bi === q.a) b.classList.add("correct");
    else if (bi === i) b.classList.add("wrong");
    else b.classList.add("faded");
  });
  score(correct, q, q.q.replace("___", q.opts[q.a]), q.opts[i]);
}

function renderBuild() {
  const q = state.qs[state.idx];
  state.built = [];
  const words = q.s.split(" ");
  const bank = shuffle(words.map((w, i) => ({ w, id: i })));
  $("qcard").innerHTML = `
    <p class="instruction">🧩 Toque nas palavras para montar a frase. Toque de novo para desfazer.</p>
    <div class="build-zone" id="zone"><span class="placeholder">Monte a frase aqui…</span></div>
    <div class="chip-bank" id="bank">${bank.map(c =>
      `<button class="chip" data-id="${c.id}">${esc(c.w)}</button>`).join("")}</div>
    <button class="btn" id="checkBtn" disabled>Verificar</button>
    <div id="feedback"></div>
    <button class="btn hidden" id="nextBtn"></button>`;
  const zone = $("zone"), bankEl = $("bank"), checkBtn = $("checkBtn");

  function refresh() {
    if (state.built.length === 0) {
      zone.innerHTML = '<span class="placeholder">Monte a frase aqui…</span>';
    } else {
      zone.innerHTML = state.built.map((c, pos) =>
        `<button class="chip placed" data-pos="${pos}">${esc(c.w)}</button>`).join("");
      zone.querySelectorAll(".chip").forEach(ch =>
        ch.addEventListener("click", () => {
          const pos = parseInt(ch.dataset.pos);
          const removed = state.built.splice(pos, 1)[0];
          bankEl.querySelector(`[data-id="${removed.id}"]`).classList.remove("used");
          refresh();
        }));
    }
    checkBtn.disabled = state.built.length !== words.length;
  }

  bankEl.querySelectorAll(".chip").forEach(ch =>
    ch.addEventListener("click", () => {
      if (ch.classList.contains("used")) return;
      ch.classList.add("used");
      state.built.push({ w: ch.textContent, id: parseInt(ch.dataset.id) });
      refresh();
    }));

  checkBtn.addEventListener("click", () => {
    const attempt = state.built.map(c => c.w).join(" ");
    const correct = attempt === q.s;
    zone.classList.add(correct ? "right" : "err");
    zone.classList.add(correct ? "pop" : "shake");
    zone.querySelectorAll(".chip").forEach(c => c.disabled = true);
    bankEl.querySelectorAll(".chip").forEach(c => c.disabled = true);
    checkBtn.classList.add("hidden");
    score(correct, q, q.s.replace(" ?", "?"), attempt.replace(" ?", "?"));
  });
  refresh();
}

function renderType() {
  const q = state.qs[state.idx];
  $("qcard").innerHTML = `
    <p class="qtext">${esc(q.q).replace("___", '<span class="blank">&nbsp;</span>')}</p>
    <p class="hint">💡 Dica: <b>${esc(q.hint)}</b></p>
    <div class="type-row">
      <input class="type-input" id="typeInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Digite aqui…" aria-label="Sua resposta">
      <button class="btn small" id="checkBtn">OK</button>
    </div>
    <div id="feedback"></div>
    <button class="btn hidden" id="nextBtn"></button>`;
  const input = $("typeInput");
  input.focus();
  function check() {
    const val = input.value.trim().toLowerCase().replace(/\s+/g, " ");
    if (!val) return;
    const correct = q.ans.some(a => a.toLowerCase() === val);
    input.disabled = true;
    $("checkBtn").disabled = true;
    input.classList.add(correct ? "right" : "err");
    input.classList.add(correct ? "pop" : "shake");
    score(correct, q, q.q.replace("___", q.ans[0]), val);
  }
  $("checkBtn").addEventListener("click", check);
  input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
}

function score(correct, q, fullAnswer, given) {
  state.answers.push({
    question: q.q || q.s,
    correctAnswer: fullAnswer,
    givenAnswer: given || "",
    ok: correct,
    tense: topicOf(q.cat).name
  });
  if (correct) {
    state.score++;
    state.streak++;
    state.best = Math.max(state.best, state.streak);
  } else {
    state.streak = 0;
    state.wrongs.push({ ...q, fullAnswer });
  }
  const fb = $("feedback");
  fb.innerHTML = `<div class="feedback ${correct ? "good" : "bad"}">
    <strong>${correct ? "✅ Correto!" : "❌ Quase!"}${correct && state.streak >= 3 ? `<span class="streak">🔥 ${state.streak} seguidas!</span>` : ""}</strong>
    ${!correct ? `Resposta: <b>${esc(fullAnswer)}</b><br>` : ""}${esc(q.ex)}
  </div>`;
  const nextBtn = $("nextBtn");
  nextBtn.textContent = state.idx + 1 >= state.qs.length ? "Ver resultado →" : "Próxima →";
  nextBtn.classList.remove("hidden");
  nextBtn.onclick = next;
  nextBtn.focus();
}

function next() {
  if (state.idx + 1 >= state.qs.length) return showResult();
  state.idx++;
  renderQuestion();
}

function confettiBurst() {
  const emojis = ["🎉", "⭐", "🏆", "✨", "🎊"];
  for (let i = 0; i < 24; i++) {
    const el = document.createElement("span");
    el.className = "confetti";
    el.textContent = emojis[i % emojis.length];
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (2 + Math.random() * 2) + "s";
    el.style.animationDelay = (Math.random() * .8) + "s";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
}

function showResult() {
  show(result);
  const total = state.qs.length;
  const pct = Math.round((state.score / total) * 100);
  $("finalScore").textContent = state.score;
  $("finalTotal").textContent = " / " + total;
  let medal, msg;
  if (pct === 100) { medal = "🏆"; msg = "Perfeito! Você dominou o tema!"; confettiBurst(); }
  else if (pct >= 70) { medal = "🥇"; msg = "Muito bem! Você está quase lá."; }
  else if (pct >= 50) { medal = "💪"; msg = "Bom começo! Vale revisar um pouco."; }
  else { medal = "🌱"; msg = "Continue praticando, você vai chegar lá!"; }
  $("medal").textContent = medal;
  $("finalMsg").textContent = msg;
  const modeName = MODES.find(m => m.id === state.mode).name;
  $("finalSub").textContent = `${state.level} · ${modeName} · ${pct}% de acertos · melhor sequência: ${state.best}`;

  // Atualiza progresso local e verifica desbloqueio
  $("unlockMsg").innerHTML = "";
  if (state.topic !== "mix") {
    const prog = getProg();
    const before = prog[state.topic] || 0;
    if (pct > before) { prog[state.topic] = pct; setProg(prog); }
    const idx = NIVEIS.findIndex(n => n.id === state.level);
    const nextLevel = NIVEIS[idx + 1];
    if (nextLevel && CONFIG.desbloqueio) {
      const wasLocked = before < CONFIG.pctMinimo;
      if (levelUnlocked(nextLevel.id) && wasLocked && pct >= CONFIG.pctMinimo) {
        $("unlockMsg").innerHTML = `<span class="unlock">🔓 Nível ${nextLevel.id} desbloqueado!</span>`;
        confettiBurst();
      }
    }
  }

  saveGameToCloud(pct, total, modeName);

  const rev = $("review");
  if (state.wrongs.length) {
    rev.innerHTML = "<h2>Para revisar</h2>" + state.wrongs.map(q =>
      `<div class="review-item"><span class="ans">${esc(q.fullAnswer)}</span><br><span style="color:var(--ink-soft)">${esc(q.ex)}</span></div>`).join("");
  } else {
    rev.innerHTML = "";
  }

  $("againBtn").onclick = () => start(state.topic, state.mode);
  $("modeBtn").onclick = () => openModes(state.topic);
  $("menuBtn").onclick = () => openLevel(state.level);
}

let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} catch (e) { console.warn("Firebase não configurado:", e); }

async function saveGameToCloud(pct, total, modeName) {
  if (!db || !player) return;
  try {
    const id = slugName(player);
    const studentRef = db.collection("students").doc(id);
    await studentRef.set({
      name: player,
      lastPlayed: firebase.firestore.FieldValue.serverTimestamp(),
      gamesCount: firebase.firestore.FieldValue.increment(1),
      totalCorrect: firebase.firestore.FieldValue.increment(state.score),
      totalQuestions: firebase.firestore.FieldValue.increment(total)
    }, { merge: true });
    await studentRef.collection("games").add({
      date: firebase.firestore.FieldValue.serverTimestamp(),
      level: state.level,
      topic: state.topic,
      topicName: state.topic === "mix" ? "Modo misto" : topicOf(state.topic).name,
      mode: state.mode,
      modeName: modeName,
      score: state.score,
      total: total,
      pct: pct,
      bestStreak: state.best,
      questions: state.answers
    });
  } catch (e) {
    console.warn("Não foi possível salvar o resultado:", e);
  }
}

// ---------- Registro do aluno ----------
function enterName() {
  const val = $("nameInput").value.trim();
  if (val.length < 2) {
    $("nameError").textContent = "Digite um nome com pelo menos 2 letras.";
    return;
  }
  $("nameError").textContent = "";
  player = val;
  try { localStorage.setItem("gq_player", val); } catch (e) {}
  $("playerName").textContent = player;
  if (!getPlacement()) startPlacementIntro();
  else renderLevels();
}

$("nameBtn").addEventListener("click", enterName);
$("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") enterName(); });
$("changeName").addEventListener("click", () => {
  try { localStorage.removeItem("gq_player"); } catch (e) {}
  player = null;
  $("nameInput").value = "";
  $("subtitle").textContent = "Identifique-se para começar";
  show(nameScreen);
  $("nameInput").focus();
});

try { player = localStorage.getItem("gq_player"); } catch (e) {}
if (player) {
  $("playerName").textContent = player;
  if (!getPlacement()) startPlacementIntro();
  else renderLevels();
} else {
  show(nameScreen);
}
