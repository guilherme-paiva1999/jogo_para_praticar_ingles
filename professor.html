<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Quest — Painel do professor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Sora:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root {
    --paper: #F6F4EC; --ink: #17163B; --ink-soft: #55547A; --card: #FFFFFF;
    --accent: #2447F5; --accent-soft: #DDE4FE;
    --ok: #14957A; --ok-soft: #D3EEE7;
    --bad: #D6482B; --bad-soft: #F8DCD4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Sora', sans-serif; background: var(--paper); color: var(--ink);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 48px;
    background-image: radial-gradient(#17163B0D 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1, h2, h3 { font-family: 'Bricolage Grotesque', sans-serif; }
  header { text-align: center; margin-bottom: 24px; }
  .logo {
    display: inline-block; font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
    background: var(--ink); color: var(--paper); padding: 6px 14px; border-radius: 999px;
    margin-bottom: 12px;
  }
  header h1 { font-size: clamp(24px, 6vw, 32px); font-weight: 800; }
  header p { color: var(--ink-soft); font-size: 14px; margin-top: 6px; }
  .hidden { display: none !important; }
  .card {
    background: var(--card); border: 2.5px solid var(--ink); border-radius: 20px;
    box-shadow: 6px 6px 0 var(--ink); padding: 24px 20px; margin-bottom: 16px;
  }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ink-soft); }
  .input {
    width: 100%; font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 600;
    padding: 12px 16px; border: 2px solid var(--ink); border-radius: 12px;
    background: var(--paper); color: var(--ink);
  }
  .input:focus { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
  .btn {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px;
    background: var(--ink); color: var(--paper); border: 2.5px solid var(--ink);
    border-radius: 12px; padding: 13px 20px; width: 100%; cursor: pointer; margin-top: 6px;
    box-shadow: 4px 4px 0 rgba(23,22,59,.25); transition: transform .12s ease;
  }
  .btn:hover, .btn:focus-visible { transform: translate(-1px,-1px); }
  .btn.ghost { background: var(--card); color: var(--ink); box-shadow: none; border-width: 2px; width: auto; padding: 8px 14px; font-size: 13px; }
  .error { color: var(--bad); font-size: 13px; margin-top: 10px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
  .topbar .who { font-size: 13px; color: var(--ink-soft); }

  .student-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: stretch; }
  .student {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    border: 2px solid var(--ink); border-radius: 14px; background: var(--card);
    padding: 14px 16px; cursor: pointer; flex: 1; min-width: 0;
    font-family: inherit; text-align: left;
    box-shadow: 3px 3px 0 var(--ink); transition: transform .12s ease;
  }
  .del-btn {
    border: 2px solid var(--ink); border-radius: 14px; background: var(--card);
    color: var(--bad); font-size: 18px; cursor: pointer; padding: 0 14px;
    box-shadow: 3px 3px 0 var(--ink); transition: transform .12s ease, background .15s ease;
    flex-shrink: 0;
  }
  .del-btn:hover, .del-btn:focus-visible { transform: translate(-2px,-2px); background: var(--bad-soft); }
  .del-btn:disabled { opacity: .5; cursor: default; transform: none; }
  .student:hover, .student:focus-visible { transform: translate(-2px,-2px); }
  .student .sname { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px; }
  .student .smeta { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .pill {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 14px;
    padding: 6px 12px; border-radius: 999px; border: 2px solid var(--ink); white-space: nowrap;
  }
  .pill.good { background: var(--ok-soft); }
  .pill.mid { background: #FCEBCB; }
  .pill.low { background: var(--bad-soft); }

  .game-item { border: 2px solid var(--ink); border-radius: 14px; background: var(--card); margin-bottom: 10px; overflow: hidden; }
  .game-head {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 13px 16px; cursor: pointer; width: 100%; font-family: inherit; text-align: left;
    background: var(--card); border: none;
  }
  .game-head:hover { background: var(--paper); }
  .game-head .gtitle { font-weight: 600; font-size: 14.5px; }
  .game-head .gdate { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .qlist { border-top: 2px solid var(--ink); padding: 12px 16px; background: var(--paper); }
  .qrow { padding: 10px 0; border-bottom: 1px dashed #C9C7D8; font-size: 13.5px; line-height: 1.5; }
  .qrow:last-child { border-bottom: none; }
  .qrow .mark { font-weight: 700; }
  .qrow .given { color: var(--bad); }
  .qrow .right { color: var(--ok); font-weight: 600; }
  .empty { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 20px 0; }
  .loading { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 24px 0; }
  footer { margin-top: 32px; text-align: center; font-size: 12px; color: var(--ink-soft); }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="logo">Grammar Quest · Professor</span>
    <h1 id="pageTitle">Painel do professor</h1>
    <p id="pageSub">Acompanhe o desempenho dos seus alunos</p>
  </header>

  <section id="loginScreen" class="card hidden">
    <div class="field">
      <label for="email">E-mail</label>
      <input class="input" id="email" type="email" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input class="input" id="password" type="password" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn">Entrar</button>
    <p class="error" id="loginError"></p>
  </section>

  <section id="panel" class="hidden">
    <div class="topbar">
      <span class="who" id="whoami"></span>
      <div style="display:flex; gap:8px;">
        <button class="btn ghost" id="refreshBtn">↻ Atualizar</button>
        <button class="btn ghost" id="logoutBtn">Sair</button>
      </div>
    </div>
    <div id="studentList"></div>
  </section>

  <section id="detail" class="hidden">
    <div class="topbar">
      <button class="btn ghost" id="backBtn">← Todos os alunos</button>
    </div>
    <div class="card">
      <h2 id="detailName" style="font-size:22px;"></h2>
      <p id="detailStats" style="font-size:13.5px; color:var(--ink-soft); margin-top:4px; margin-bottom:18px;"></p>
      <div id="gameList"></div>
    </div>
  </section>

  <footer>Grammar Quest · dados armazenados no Firebase Firestore</footer>
</div>

<script>
// ============================================================
// CONFIGURAÇÃO DO FIREBASE
// Cole aqui o MESMO objeto firebaseConfig usado no index.html
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyCOstRpiRu8QzPRpajdLzKw433aWLy4wc8",
  authDomain: "grammar-quest-44b9e.firebaseapp.com",
  projectId: "grammar-quest-44b9e",
  storageBucket: "grammar-quest-44b9e.firebasestorage.app",
  messagingSenderId: "1092523407281",
  appId: "1:1092523407281:web:2d9fe08db7adaca641af90"
};
// ============================================================

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const $ = id => document.getElementById(id);
const loginScreen = $("loginScreen"), panel = $("panel"), detail = $("detail");
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function show(el) { [loginScreen, panel, detail].forEach(s => s.classList.add("hidden")); el.classList.remove("hidden"); }

function fmtDate(ts) {
  if (!ts || !ts.toDate) return "—";
  return ts.toDate().toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
}
function pctClass(p) { return p >= 70 ? "good" : p >= 50 ? "mid" : "low"; }

// ---------- Login ----------
async function login() {
  $("loginError").textContent = "";
  try {
    await auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value);
  } catch (e) {
    $("loginError").textContent = "E-mail ou senha incorretos. Verifique e tente de novo.";
  }
}
$("loginBtn").addEventListener("click", login);
$("password").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("logoutBtn").addEventListener("click", () => auth.signOut());
$("refreshBtn").addEventListener("click", loadStudents);
$("backBtn").addEventListener("click", () => { show(panel); });

auth.onAuthStateChanged(user => {
  if (user) {
    $("whoami").textContent = "Conectado como " + user.email;
    show(panel);
    loadStudents();
  } else {
    show(loginScreen);
  }
});

// ---------- Lista de alunos ----------
async function loadStudents() {
  const list = $("studentList");
  list.innerHTML = '<p class="loading">Carregando alunos…</p>';
  try {
    const snap = await db.collection("students").orderBy("lastPlayed", "desc").get();
    if (snap.empty) {
      list.innerHTML = '<div class="card"><p class="empty">Nenhum aluno jogou ainda. Compartilhe o link do jogo!</p></div>';
      return;
    }
    list.innerHTML = "";
    snap.forEach(doc => {
      const d = doc.data();
      const pct = d.totalQuestions ? Math.round((d.totalCorrect / d.totalQuestions) * 100) : 0;
      const row = document.createElement("div");
      row.className = "student-row";
      const btn = document.createElement("button");
      btn.className = "student";
      btn.innerHTML = `
        <span>
          <span class="sname">${esc(d.name || doc.id)}</span>
          <span class="smeta" style="display:block">${d.gamesCount || 0} partida(s) · último jogo: ${fmtDate(d.lastPlayed)}</span>
        </span>
        <span class="pill ${pctClass(pct)}">${pct}%</span>`;
      btn.addEventListener("click", () => openStudent(doc.id, d));
      const del = document.createElement("button");
      del.className = "del-btn";
      del.title = "Excluir aluno";
      del.setAttribute("aria-label", "Excluir " + (d.name || doc.id));
      del.textContent = "🗑";
      del.addEventListener("click", () => deleteStudent(doc.id, d.name || doc.id, del));
      row.appendChild(btn);
      row.appendChild(del);
      list.appendChild(row);
    });
  } catch (e) {
    list.innerHTML = '<div class="card"><p class="empty">Erro ao carregar. Verifique sua conexão e as regras do Firestore.</p></div>';
    console.error(e);
  }
}

// ---------- Excluir aluno ----------
async function deleteStudent(id, name, btnEl) {
  const sure = confirm(
    `Excluir "${name}"?\n\nTodas as partidas e resultados desse aluno serão apagados PERMANENTEMENTE. Essa ação não pode ser desfeita.`
  );
  if (!sure) return;
  btnEl.disabled = true;
  btnEl.textContent = "…";
  try {
    const studentRef = db.collection("students").doc(id);
    // Apaga as partidas em lotes (o Firestore não apaga subcoleções sozinho)
    while (true) {
      const snap = await studentRef.collection("games").limit(300).get();
      if (snap.empty) break;
      const batch = db.batch();
      snap.forEach(doc => batch.delete(doc.ref));
      await batch.commit();
    }
    await studentRef.delete();
    loadStudents();
  } catch (e) {
    console.error(e);
    alert("Não foi possível excluir. Verifique se as regras do Firestore foram atualizadas (allow delete para usuários autenticados).");
    btnEl.disabled = false;
    btnEl.textContent = "🗑";
  }
}

// ---------- Detalhe do aluno ----------
async function openStudent(id, d) {
  show(detail);
  $("detailName").textContent = d.name || id;
  const pct = d.totalQuestions ? Math.round((d.totalCorrect / d.totalQuestions) * 100) : 0;
  $("detailStats").textContent =
    `${d.gamesCount || 0} partida(s) · ${d.totalCorrect || 0} acertos em ${d.totalQuestions || 0} questões (${pct}%)`;
  const list = $("gameList");
  list.innerHTML = '<p class="loading">Carregando partidas…</p>';
  try {
    const snap = await db.collection("students").doc(id).collection("games").orderBy("date", "desc").limit(60).get();
    if (snap.empty) {
      list.innerHTML = '<p class="empty">Nenhuma partida registrada.</p>';
      return;
    }
    list.innerHTML = "";
    snap.forEach(doc => {
      const g = doc.data();
      const item = document.createElement("div");
      item.className = "game-item";
      const qsHtml = (g.questions || []).map(q => `
        <div class="qrow">
          <span class="mark">${q.ok ? "✅" : "❌"}</span>
          <b>[${esc(q.tense || "")}]</b> ${esc(q.question)}<br>
          ${q.ok
            ? `<span class="right">Respondeu: ${esc(q.givenAnswer)}</span>`
            : `<span class="given">Respondeu: ${esc(q.givenAnswer) || "—"}</span> · <span class="right">Correto: ${esc(q.correctAnswer)}</span>`}
        </div>`).join("");
      item.innerHTML = `
        <button class="game-head">
          <span>
            <span class="gtitle">${esc(g.topicName || g.topic)} · ${esc(g.modeName || g.mode)}</span>
            <span class="gdate" style="display:block">${fmtDate(g.date)} · sequência máx: ${g.bestStreak || 0}</span>
          </span>
          <span class="pill ${pctClass(g.pct)}">${g.score}/${g.total}</span>
        </button>
        <div class="qlist hidden">${qsHtml || '<p class="empty">Sem detalhes das questões.</p>'}</div>`;
      item.querySelector(".game-head").addEventListener("click", () => {
        item.querySelector(".qlist").classList.toggle("hidden");
      });
      list.appendChild(item);
    });
  } catch (e) {
    list.innerHTML = '<p class="empty">Erro ao carregar as partidas.</p>';
    console.error(e);
  }
}
</script>
</body>
</html>
